seed: 42
seeds: [42, 7, 123]
num_samples: 400
train_fraction: 0.70
val_fraction: 0.15
noise_levels: [0.0, 0.05, 0.1, 0.2, 0.3]
label_threshold: 1.0e-8
measurement_noise_std: 0.0
include_generic: false
primary_features: [XX, YY, ZZ, XZ]
feature_sets:
  - [XX, ZZ]
  - [XX, YY, ZZ]
  - [XX, YY, ZZ, XZ]
  - [XX, YY, ZZ, XI, IZ, XZ]
  - [XI, YI, ZI, IX, IY, IZ, XX, YY, ZZ]
  - [XI, YI, ZI, IX, IY, IZ, XX, XY, XZ, YX, YY, YZ, ZX, ZY, ZZ]
quantum:
  max_wires: 4
  layers: 1
c_grid: [0.1, 1.0, 10.0, 100.0]
gamma_grid: [scale, 0.1, 1.0]
output_dir: results
data_dir: data/processed
